# Codemagic 构建配置
# 关键修复1: iOS 构建前先 `pod repo update`, 否则 CocoaPods specs 仓库过旧,
# 无法解析 media_kit(media_kit_libs_video) 引入的二进制原生依赖
# (Avformat / Freetype / Mbedx509 等 xcframework), 导致 pod install 失败。
#
# 关键修复2: 早期为绕过 Codemagic 缓存 ~/.cocoapods/repos 导致 `pod repo update` 被判定
# "已是最新" 而 specs 过旧, 曾在更新前 `rm -rf ~/.cocoapods/repos/trunk` 强制重建。但
# 该仓库体积巨大, 全量重新克隆在海外机构建机极易超时(curl: (56) Recv failure)。
# 现改为: 将整个 ~/.cocoapods/repos 纳入 cache_paths 持久化, 仅做增量 `pod repo update`
# (每次构建都更新, specs 始终新鲜, 不会再报 "too out-of-date"), 不再 rm 全量重建。
#
# 关键修复3: Flutter 模板 Podfile 默认把 `platform :ios` 注释掉, CocoaPods 自动分配
# iOS 13.0, 但 Flutter pod 要求更高的 min deployment target, 报
# "could not find compatible versions for pod Flutter ... required a higher
# minimum deployment target"。因此在 pod install 前用 sed 显式声明
# `platform :ios, "15.0"`(若仍报 higher, 改为 "17.0")。
#
# 关键修复4: pangrowth_content(穿山甲内容/短剧 SDK) 依赖的 `Pangrowth/media` pod
# 不在 CocoaPods 公共 trunk, 而托管在 Volcengine 私有 spec 仓库:
#   https://github.com/volcengine/volcengine-specs.git
# 必须通过 `pod repo add` 注册该源, 并把 source 显式写进 Podfile, 否则报
# "None of your spec sources contain a spec satisfying Pangrowth/media"。
#
# 关键修复5: 穿山甲/火山引擎 SDK(RangersAPM / RangersAppLog / OneKit / TTSDKFramework)
# 含静态链接二进制, 而 Flutter 模板默认 `use_frameworks!`(动态)。两者冲突报
# "target has transitive dependencies that include statically linked binaries"。
# 解决: 把 `use_frameworks!` 改为 `use_frameworks! :linkage => :static`。
#
# 关键修复6: YYText(被部分 Flutter 插件间接依赖)在 Xcode 15+ / Xcode 26 下, 源码
#   YYTextLayout.m 中的链式比较 'X < Y < Z' 被 Clang 判定为语义错误, 编译直接失败:
#   "Chained comparison 'X < Y < Z' does not behave the same as a mathematical expression"
#   注意: 该诊断在新版 Clang 中是"默认 error", 只加 -Wno-xxx 或关 CLANG_WARN_CHAINED_COMPARISON
#   都压不住(实测无效)。因此采用根治方案: 直接改写源码, 把链式比较改成三元表达式:
#     position = fabs(left - point.x) < fabs(right - point.x) < (right ? prev : next);
#     =>    position = (fabs(left - point.x) < fabs(right - point.x)) ? prev : next;
#   同时在 post_install 里追加 -Wno-chained-comparison 作为双保险。
#   注意: CocoaPods 不支持多个 post_install 钩子("Specifying multiple `post_install`
#   hooks is unsupported"), 故修复代码必须插入 Flutter 模板已有的 post_install 内部。
#
# 使用方式:
#   1. 仓库根目录放置本文件
#   2. Codemagic 项目设置 → Workflow → 选择 "codemagic.yaml"
#   3. 若需要真机/App Store 分发, 请在下方 environment 配置代码签名
#      (App Store Connect API key / 证书), 否则把 `flutter build ios --release`
#      改为 `flutter build ios --release --no-codesign` 仅验证构建

workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        # 缓存 CocoaPods 全部 spec 仓库(trunk + volcengine): 该目录体积巨大,
        # 不缓存时 rm 后全量重建在海外机构建机极易超时(本次 curl: (56) 超时即源于此)。
        # 持久化后只做增量 pod repo update, 远快且 specs 始终新鲜。
        - $HOME/.cocoapods/repos
        # 缓存 pod 下载的二进制(穿山甲/火山引擎 SDK zip), 避免每次都重新到
        # 字节跳动中国 CDN(sf3-fe-tos.pglstatp-toutiao.com) 拉取(海外机易 Connection reset)
        - $HOME/.cocoapods/downloads
    scripts:
      - name: Flutter packages get
        script: flutter pub get
      - name: 注册 Volcengine 源 + 设置部署目标 + 静态链接 + 安装 pods
        script: |
          set -e
          # ---- 网络/代理 ----
          # Codemagic 海外机拉取 CocoaPods trunk(cdn.cocoapods.org)、volcengine-specs(github.com)
          # 或穿山甲/火山引擎 SDK 二进制(中国 CDN pglstatp-toutiao.com) 易超时/连接重置。
          # 请在 Codemagic 项目设置 → 环境变量 中配置加密变量 HTTPS_PROXY(可选 HTTP_PROXY),
          # 指向一个能访问上述地址的代理; 留空则不使用代理。
          if [ -n "$HTTPS_PROXY" ]; then
            export https_proxy="$HTTPS_PROXY" http_proxy="${HTTP_PROXY:-$HTTPS_PROXY}"
            git config --global http.proxy "$https_proxy" || true
            git config --global https.proxy "$https_proxy" || true
            echo "已启用网络代理: $https_proxy"
          fi
          # 网络操作重试封装, 容忍海外机瞬时超时
          retry() {
            local n=0 max=6
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge "$max" ]; then echo "已重试 $max 次仍失败: $*"; return 1; fi
              echo "网络操作失败, 15s 后第 $n 次重试..."; sleep 15
            done
          }
          cd ios
          # 确保 Podfile 存在(Flutter 首次 build 时生成; 缺失则补生成)
          [ -f Podfile ] || flutter create --platforms=ios .
          # 1) 取消 Flutter 模板里被注释的 platform 行, 并提高最低版本到 15.0
          sed -i '' 's/^# *platform :ios.*/platform :ios, "15.0"/' Podfile
          grep -q "^platform :ios" Podfile || printf 'platform :ios, "15.0"\n%s\n' "$(cat Podfile)" > Podfile
          # 2) 注册穿山甲内容 SDK 必需的 Volcengine 私有 spec 源(幂等, 带重试)
          if ! pod repo list | grep -q volcengine; then
            retry pod repo add volcengine https://github.com/volcengine/volcengine-specs.git
          fi
          # 3) 显式写入 Podfile 的 source(官方推荐做法)
          if ! grep -q "volcengine-specs" Podfile; then
            TMP=$(mktemp)
            {
              echo "source 'https://cdn.cocoapods.org/'"
              echo "source 'https://github.com/volcengine/volcengine-specs.git'"
              cat Podfile
            } > "$TMP"
            mv "$TMP" Podfile
          fi
          # 4) 关键: 穿山甲/火山引擎 SDK 含静态二进制, use_frameworks! 需改为 static linkage
          grep -q "use_frameworks! :linkage" Podfile || sed -i '' 's/^\( *\)use_frameworks!$/\1use_frameworks! :linkage => :static/' Podfile
          # 5) 关键: YYText 链式比较在 Xcode 15+/26 下是默认 error, 必须改源码。
          #    重要: CocoaPods 不支持多个 post_install 钩子(Flutter 模板自带的 Podfile 已有一个),
          #    因此必须把修复代码插入已有 post_install 内部, 绝不能再追加第二个 post_install。
          if ! grep -q "YYTEXT_CHAINED_FIX" Podfile; then
            cat > /tmp/yytext_fix.rb <<'RUBY'
          # YYTEXT_CHAINED_FIX
          # (a) 双保险: 关闭链式比较告警, 并阻止其被 -Werror 提升为错误
          installer.pods_project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CLANG_WARN_CHAINED_COMPARISON'] = 'NO'
              other = config.build_settings['OTHER_CFLAGS']
              other = '' if other.nil?
              other = other.join(' ') if other.is_a?(Array)
              unless other.include?('-Wno-error=chained-comparison')
                config.build_settings['OTHER_CFLAGS'] = (other + ' -Wno-chained-comparison -Wno-error=chained-comparison').strip
              end
            end
          end
          # (b) 根治: 直接改写 YYText 源码里的链式比较(改成三元表达式)
          begin
            yy = File.join(installer.sandbox.root.to_s, 'YYText', 'YYText', 'Component', 'YYTextLayout.m')
            if File.exist?(yy)
              src = File.read(yy)
              out = src.gsub('position = fabs(left - point.x) < fabs(right - point.x) < (right ? prev : next);',
                             'position = (fabs(left - point.x) < fabs(right - point.x)) ? prev : next;')
              out = out.gsub('position = fabs(left - point.y) < fabs(right - point.y) < (right ? prev : next);',
                             'position = (fabs(left - point.y) < fabs(right - point.y)) ? prev : next;')
              if out != src
                File.write(yy, out)
                puts "[YYTEXT_CHAINED_FIX] patched: #{yy}"
              end
            end
          rescue => e
            puts "[YYTEXT_CHAINED_FIX] skipped: #{e.message}"
          end
          RUBY
            if grep -q "post_install do |installer|" Podfile; then
              awk '/^ *post_install do \|installer\|/ {print; while ((getline line < "/tmp/yytext_fix.rb") > 0) print line; next} {print}' Podfile > Podfile.tmp && mv Podfile.tmp Podfile
            else
              printf 'post_install do |installer|\n' >> Podfile
              cat /tmp/yytext_fix.rb >> Podfile
              printf 'end\n' >> Podfile
            fi
            grep -q "YYTEXT_CHAINED_FIX" Podfile || { echo "ERROR: 未能注入 YYText 链式比较修复"; exit 1; }
          fi
          cat Podfile
          # 6) 增量刷新 specs: ~/.cocoapods/repos 已通过 cache_paths 持久化(不再 rm 全量重建),
          #    增量 pod repo update 远快于全量克隆且保持 specs 新鲜; 所有网络操作均带重试。
          retry pod repo update
          retry pod install --repo-update
          # 7) 兜底: pod install 之后再直接改写 YYText 源码一次。
          #    原因: 下一步 `flutter build ios` 会打印 "Upgrading Podfile" 重新生成 Podfile,
          #    可能把上面注入的 post_install 钩子冲掉, 此时只有源码已被改写才安全。
          #    sed 是幂等的(改完之后模式串就不再存在, 重复执行无副作用)。
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          YYTEXT="$REPO_ROOT/ios/Pods/YYText/YYText/Component/YYTextLayout.m"
          if [ -f "$YYTEXT" ]; then
            sed -i '' \
              -e 's/position = fabs(left - point\.x) < fabs(right - point\.x) < (right ? prev : next);/position = (fabs(left - point.x) < fabs(right - point.x)) ? prev : next;/' \
              -e 's/position = fabs(left - point\.y) < fabs(right - point\.y) < (right ? prev : next);/position = (fabs(left - point.y) < fabs(right - point.y)) ? prev : next;/' \
              "$YYTEXT"
            grep -n "? prev : next" "$YYTEXT" || true
          else
            echo "WARN: 未找到 $YYTEXT, 跳过源码兜底修补"
          fi
      - name: Build iOS
        # 先用 --no-codesign 验证 pod 安装是否通过; 验证 OK 后再配代码签名并去掉该参数
        script: |
          set -e
          # 再兜底一次: 万一上一步之后 Pods 被重新解包, 这里改回正确源码(幂等)
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          YYTEXT="$REPO_ROOT/ios/Pods/YYText/YYText/Component/YYTextLayout.m"
          if [ -f "$YYTEXT" ]; then
            sed -i '' \
              -e 's/position = fabs(left - point\.x) < fabs(right - point\.x) < (right ? prev : next);/position = (fabs(left - point.x) < fabs(right - point.x)) ? prev : next;/' \
              -e 's/position = fabs(left - point\.y) < fabs(right - point\.y) < (right ? prev : next);/position = (fabs(left - point.y) < fabs(right - point.y)) ? prev : next;/' \
              "$YYTEXT"
            grep -n "? prev : next" "$YYTEXT" || true
          else
            echo "WARN: 未找到 $YYTEXT, 跳过源码兜底修补"
          fi
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - user@example.com # TODO: 替换为你的接收邮箱
