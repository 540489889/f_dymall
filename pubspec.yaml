name: flutter3_dymall
description: "原创Flutter3.41.5+Dart3.11.3+Getx仿抖音短视频+聊天+直播App商城 Q: 282310962"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
version: 1.0.0+1

environment:
  sdk: ^3.11.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  card_swiper: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  flutter_staggered_grid_view: ^0.7.0
  get: ^4.7.3
  get_storage: ^2.1.1
  photo_view: ^0.15.0
  shirne_dialog: ^4.9.0
  uuid: ^4.5.2
  url_launcher: ^6.3.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  dio: ^5.11.1
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 依赖 html 内部 API matches(), 0.15.7 已移除, 锁 0.15.6
  html: 0.15.6
  mobile_scanner: ^7.4.2
  ai_barcode_scanner: ^8.2.0
  # 直播间 WebSocket(与H5 Config.socketUrl 同一服务)
  web_socket_channel: ^3.0.3
  # 直播间商品面板: 常驻可拖动升降的 sheet(80% <-> 全屏)
  smooth_sheets: ^1.3.0
  # 直播连麦: 腾讯云 TRTC(观众/嘉宾端音视频连麦)
  tencent_rtc_sdk: ^13.5.2
  # 直播连麦: 进房前申请相机 / 麦克风权限
  permission_handler: ^13.0.2
  # 直播间/连麦期间保持屏幕常亮(Android 用 FLAG_KEEP_SCREEN_ON, iOS 用 idleTimerDisabled)
  wakelock_plus: ^1.3.3
  # GroMore 聚合广告SDK(穿山甲/巨量引擎): 赚钱页的激励视频/插屏/Banner
  # * 后台用了瀑布流+竞价, 必须走聚合SDK, 普通穿山甲SDK请求聚合代码位会报 20001/40034
  gromore_ads: ^1.0.3
  # 穿山甲内容输出(短剧/小视频/短故事), 依赖上面的 gromore_ads 提供广告能力
  # * 需要后台「内容合作」下发的 SDK_Setting_*.json, 放到 assets/ 下并改 Content.configPath
  pangrowth_content: ^1.0.3
  fluwx: ^6.0.4
  # 阿里云号码认证: APP 一键登录(需 Config.aliAndroidSk / aliIosSk)
  ali_auth: ^1.3.9
  # 阿里云移动推送(离线推送): 通知栏消息 / 透传消息, 按 alias(会员id)精准推送
  # * 需在 lib/config/index.dart 填 Config.aliPushAppKey / aliPushAppSecret(阿里云 EMAS 控制台按包名创建的应用)
  # * 厂商通道(华为/小米)走系统通道, 离线也能收; Android 需在 build.gradle.kts 加阿里云 maven 仓 + manifest 配 appid
  # * iOS 需在 Xcode 开 Push Notifications 能力并上传 APNs 证书到 EMAS 控制台
  aliyun_push: ^1.2.0
  # 本地通知: 前台收到推送时补弹一条高优先级通知(阿里云 SDK 前台只静默展示), 并接管点击跳转
  flutter_local_notifications: ^17.2.0
  # 推送 bind 接口要上报厂商/机型/系统版本(后台用来判断走哪家厂商通道)
  device_info_plus: ^11.5.0
  # 网络可用性监听: iOS 首启网络授权后可触发首页重刷
  connectivity_plus: ^6.1.0
  # 关于我们: 读取 APP 版本号(对齐 H5 plus.runtime.getProperty)
  package_info_plus: ^8.1.0
  # 关于我们: 生成 APP 下载二维码
  qr_flutter: ^4.1.0
  # 头像: 拍照/系统相册选择
  image_picker: ^1.1.2
  # 生日: 成熟滚轮日期选择器(自带中文,不依赖 MaterialLocalizations)
  flutter_datetime_picker_plus: ^2.1.0
  # 邀请好友: 截图海报保存到系统相册
  image_gallery_saver_plus: ^5.1.1
  # 手机桌面长按 App 图标快捷方式: 扫一扫 / 每日任务 / 付款码
  quick_actions: ^1.0.0

# 微信 SDK(fluwx): app_id 只是配置, 真正注册在代码里调 fluwx.registerApi
# * debug_logging 打开后能看到微信返回的错误码, 排「分享失败」用(仅 Android 生效)
fluwx:
  app_id: wx1ea2d457d5bba58a
  debug_logging: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # APP 图标生成: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# APP 图标源图(assets/images/mlogo.png),生成 Android mipmap / iOS AppIcon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mlogo.png"
  min_sdk_android: 21
  # iOS 图标不允许透明通道,自动去透明并补白底
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # 注意: Flutter 的目录条目只收录该目录下的直接文件, 不会递归进子目录!
    # 因此 images 下每个子目录都必须单独列一条, 新增子目录时记得在这里补。
    # * 各条目之间不能有包含关系(如同时列 assets/ 根), 否则同一文件被复制两次,
    #   Windows 上 Gradle 会报 errno 183(当文件已存在时无法创建)。
    # * assets/audio/ 连麦呼叫提示音(link_mic.dart 循环播放)。
    # * 穿山甲内容SDK配置(SDK_Setting_*.json)如启用, 需在 assets/ 根下并在此单独列文件。
    - assets/audio/
    - assets/images/
    - assets/images/avatar/
    - assets/images/emotion/
    - assets/images/emotion/face01/
    - assets/images/emotion/face02/
    - assets/images/emotion/face03/
    - assets/images/emotion/face04/
    - assets/images/emotion/face05/
    - assets/images/gift/
    - assets/images/make/
    - assets/images/me/
    - assets/images/newico/
    - assets/images/svg/
    - assets/SDK_Setting.json

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
